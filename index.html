<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYROX">
<meta name="theme-color" content="#F3F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>HYROX Santiago</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#F3F3EF; --surface:#FFFFFF; --surface2:#ECECE7; --line:rgba(0,0,0,.09);
  --text:#141414; --muted:#6A6A6F; --faint:#A3A3A8;
  --accent:#FFD400; --on-accent:#141414; --accent-text:#8A6B00; --real:#B08A00;
  --ok:#1E8E4E; --ok-bg:rgba(30,142,78,.12);
  --warn:#B86A00; --warn-bg:rgba(230,140,0,.14);
  --bad:#C62D22; --bad-bg:rgba(198,45,34,.10);
  --heat0:#E3E3DE; --heat1:#F2DE86; --heat2:#FFD400;
  --s0:#E5484D; --s1:#F28C28; --s2:#F2C94C; --s3:#9CCB4A; --s4:#239B4E;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --r:20px;
  --t-pierna:#FF7A45; --t-caminadora:#E0B800; --t-upper:#2F9BD6; --t-hyrox:#A45CE0; --t-trote:#1E9E6A; --t-descanso:#9A9AA0; --t-carrera:#141414;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0B0C; --surface:#161618; --surface2:#222226; --line:rgba(255,255,255,.08);
    --text:#F4F4F3; --muted:#9C9CA3; --faint:#5E5E64;
    --accent-text:#FFD400; --real:#FFD400;
    --ok:#32D16A; --ok-bg:rgba(50,209,106,.14);
    --warn:#FFA526; --warn-bg:rgba(255,165,38,.14);
    --bad:#FF5A4E; --bad-bg:rgba(255,90,78,.13);
    --heat0:#232327; --heat1:#6B5A12; --heat2:#FFD400;
    --s0:#E5484D; --s1:#F2994A; --s2:#E8C547; --s3:#A8D65E; --s4:#30D158;
    --shadow:none;
    --t-caminadora:#FFD400; --t-carrera:#F4F4F3;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;min-height:100vh}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  padding:calc(env(safe-area-inset-top) + 10px) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{margin:2px 0 0;font-size:28px;line-height:1.1;letter-spacing:-.02em;font-weight:800}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:22px;height:22px}

main{padding:4px calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:600;color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sect{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 4px 8px}

/* Chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;white-space:nowrap}
.chip.accent{background:var(--accent);color:var(--on-accent)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-mute{background:var(--surface2);color:var(--muted)}
.b-acc{background:var(--accent);color:var(--on-accent)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;font-weight:700;font-size:17px;background:var(--surface2);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:40px;font-size:15px;border-radius:12px;padding:0 14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--accent-text);font-weight:600;font-size:14px;padding:6px 0}

/* Hero */
.hero{background:var(--text);color:var(--bg);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero .big{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:.95}
.hero .lbl{font-size:15px;font-weight:600;opacity:.75}
.hero .chip{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.hero .chip.accent{background:var(--accent);color:var(--on-accent)}
.hero .bar{height:6px;border-radius:9px;background:color-mix(in srgb,var(--bg) 18%,transparent);margin-top:16px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.hero .stripe{position:absolute;right:-30px;top:18px;width:150px;height:14px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 36px);transform:rotate(-35deg);opacity:.9}

/* Alerts */
.alert{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.alert .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px}
.alert.acc{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.alert.acc .ic{background:var(--accent);color:var(--on-accent)}
.alert.info{background:var(--surface)}
.alert.info .ic{background:var(--surface2)}
.alert.warn{background:var(--warn-bg)}
.alert.warn .ic{background:var(--warn);color:#fff}
.alert b{display:block;font-size:15px}
.alert p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.alert .btn{margin-top:10px}

/* Week strip */
.week{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;gap:4px;align-items:center}
.week .nav{height:56px;display:grid;place-items:center;color:var(--muted);font-size:20px}
.day{height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.day .n{font-size:16px;color:var(--text);font-weight:700}
.day .st{width:8px;height:8px;border-radius:50%}
.day.sel{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--text)}
.day.today .n{color:var(--accent-text)}
.st.hecha{background:var(--accent)}
.st.nofui{box-shadow:inset 0 0 0 2px var(--faint)}
.st.pend{box-shadow:inset 0 0 0 2px var(--text)}
.st.rest{background:var(--line)}
.st.race{background:var(--text)}

/* Session card */
.ses{position:relative}
.ses .kick{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ses .kick .dot{width:10px;height:10px;border-radius:50%}
.ses h3{font-size:26px;line-height:1.12;margin:8px 0 10px;letter-spacing:-.02em;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.meta .chip svg{width:14px;height:14px}
.box{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:14px}
.box+.box{margin-top:8px}
.box b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{background:var(--surface);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.acts{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}
.done-banner{display:flex;align-items:center;gap:10px;margin-top:14px;padding:14px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700}
.done-banner svg,.btn svg{width:22px;height:22px;flex:none}
.done-banner.miss{background:var(--surface2);color:var(--text)}
.done-banner button{margin-left:auto;font-size:14px;font-weight:700;text-decoration:underline;color:inherit}
.tomorrow{display:flex;gap:10px;align-items:center;font-size:14px;padding:12px 16px;background:var(--surface);border-radius:16px}

/* Habits */
.hab{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:8px 2px;text-align:left;border-top:1px solid var(--line)}
.hab:first-of-type{border-top:0}
.chk{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--faint);transition:all .15s}
.chk svg{width:18px;height:18px;opacity:0}
.on .chk{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.on .chk svg{opacity:1}
.hab .t{font-weight:650;font-size:16px}
.hab .s{font-size:13px;color:var(--muted)}
.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 8px}
.meal{min-height:54px;border-radius:14px;background:var(--surface2);font-size:13px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;padding:4px}
.meal.on{background:var(--accent);color:var(--on-accent)}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ring,var(--accent)) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:17px;font-weight:800;line-height:1}
.ring span small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.pts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pts span{font-size:12px;font-weight:650;padding:3px 7px;border-radius:7px;background:var(--surface2);color:var(--muted)}
.pts span.full{color:var(--text)}

/* Streaks */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat .v{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat .u{font-size:14px;font-weight:600;color:var(--muted)}
.stat .l{font-size:13px;font-weight:700;margin-bottom:8px}
.stat .best{font-size:13px;color:var(--muted);margin-top:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:36px;border-radius:9px;font-size:14px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.heat{display:grid;gap:3px;margin-top:14px}
.hc{aspect-ratio:1;border-radius:3px;background:var(--heat0)}
.hc.l1{background:var(--heat1)}
.hc.l2{background:var(--heat2)}
.hc.rest{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hc.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
.hc.fut{opacity:.35}
.hc.today{outline:2px solid var(--text);outline-offset:1px}
.hc.race{background:var(--text)}
.hc.s0{background:var(--s0)} .hc.s1{background:var(--s1)} .hc.s2{background:var(--s2)} .hc.s3{background:var(--s3)} .hc.s4{background:var(--s4)}
.hc[data-action]{cursor:pointer}
.avg{display:flex;gap:10px;margin-top:14px}
.avg div{flex:1;background:var(--surface2);border-radius:12px;padding:9px 10px}
.avg small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.avg strong{font-size:20px;font-weight:800}
.hl{font-size:10px;color:var(--muted);font-weight:600;line-height:1;align-self:center;white-space:nowrap;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.wk{display:grid;grid-template-columns:92px 1fr 44px;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.pbar{height:10px;border-radius:9px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:9px}

/* Checkpoints */
.cp{border-left:4px solid transparent}
.cp.next{border-left-color:var(--accent)}
.cp .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cp .date{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cp .ttl{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kv div{background:var(--surface2);border-radius:12px;padding:9px 10px}
.kv small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kv strong{font-size:17px;font-weight:800}
.kv em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:2px}
.rec{margin-top:10px;border-radius:14px;padding:12px 14px;font-size:14px}
.rec b{display:block;margin-bottom:2px}
.rec.ok{background:var(--ok-bg)} .rec.warn{background:var(--warn-bg)} .rec.bad{background:var(--bad-bg)} .rec.acc{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.goal{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.goal .g{flex:1;font-size:14px;font-weight:600}
.tri{display:flex;gap:6px}
.tri button{min-height:38px;padding:0 12px;border-radius:10px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--muted)}
.tri button.on-ok{background:var(--ok);color:#fff}
.tri button.on-no{background:var(--text);color:var(--bg)}

/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-weight:600}
.chart .meta{stroke:var(--faint);stroke-width:2;fill:none;stroke-dasharray:5 5}
.chart .real{stroke:var(--real);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:var(--real);stroke:var(--surface);stroke-width:2}
.chart .tope{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:4 4}
.chart .band{fill:var(--ok-bg)}
.chart .todayl{stroke:var(--text);stroke-width:1;opacity:.35}
.chart .vl{fill:var(--text);font-size:11px;font-weight:800}
.chart .tl{font-size:10px;font-weight:700}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.trow:first-child{border-top:0}
.del{width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:20px;display:grid;place-items:center}

/* Plan */
.phase{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.phase:first-of-type{border-top:0}
.phase .n{width:34px;height:34px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-weight:800}
.phase.cur .n{background:var(--accent);color:var(--on-accent)}
.phase.past{opacity:.55}
.phase .t{font-weight:750}
.pd{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.pd:first-child{border-top:0}
.pd .dn{font-weight:800;font-size:14px;padding-top:1px}
.pd .c{font-weight:650}
.pd.today{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:10px;padding-left:6px;padding-right:6px;margin:0 -6px}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:0 18px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{height:34px;font-size:14px}
details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:0;padding-top:0}
summary{font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
details ul{margin:8px 0 0;padding-left:20px;font-size:14px}
details li+li{margin-top:4px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line);
  padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;font-size:11px;font-weight:650;color:var(--muted)}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--text)}
.tab.on .pip{background:var(--accent)}
.pip{width:18px;height:3px;border-radius:3px;background:transparent;margin-top:1px}

/* Modal / sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px calc(18px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));animation:up .22s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--faint);margin:0 auto 12px}
.sheet h2{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.input{width:100%;min-height:50px;border-radius:14px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;font-size:17px;-webkit-appearance:none;appearance:none}
textarea.input{padding:12px 14px;min-height:110px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--text)}

/* =====================================================================
   STORAGE — única puerta a los datos. Etapa 2: cambiar `backend`
   por @capacitor/preferences (init ya es async, el resto no cambia).
   ===================================================================== */
const storage = (() => {
  const PREFIX = 'hyrox:';
  let cache = {};
  let ls = null;
  try { ls = window.localStorage; ls.setItem(PREFIX + '__t', '1'); ls.removeItem(PREFIX + '__t'); } catch (e) { ls = null; }
  const backend = {
    async load() {
      const out = {};
      if (!ls) return out;
      for (let i = 0; i < ls.length; i++) {
        const k = ls.key(i);
        if (k && k.startsWith(PREFIX)) { try { out[k.slice(PREFIX.length)] = JSON.parse(ls.getItem(k)); } catch (e) {} }
      }
      return out;
    },
    write(k, v) { if (!ls) return true; try { ls.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { console.warn('No se pudo guardar', e); return false; } },
    del(k) { if (ls) ls.removeItem(PREFIX + k); },
  };
  return {
    async init() { cache = await backend.load(); },
    get(k, def) { return k in cache ? cache[k] : def; },
    set(k, v) { cache[k] = v; return backend.write(k, v); }, // false = sin espacio
    remove(k) { delete cache[k]; backend.del(k); },
    clear() { Object.keys(cache).forEach(k => backend.del(k)); cache = {}; },
    exportAll() { return { app: 'hyrox-santiago', version: 1, exportado: new Date().toISOString(), datos: JSON.parse(JSON.stringify(cache)) }; },
    importAll(obj) {
      if (!obj || obj.app !== 'hyrox-santiago' || typeof obj.datos !== 'object') throw new Error('Este archivo no es un respaldo de la app.');
      this.clear();
      Object.entries(obj.datos).forEach(([k, v]) => this.set(k, v));
    },
    ready: () => !!ls,
  };
})();

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIAS_C = ['lun','mar','mié','jue','vie','sáb','dom'];
const DIAS_1 = ['L','M','M','J','V','S','D'];

const fechaDebug = (() => { const f = new URLSearchParams(location.search).get('fecha'); return /^\d{4}-\d{2}-\d{2}$/.test(f || '') ? f : null; })();
function hoyReal() { return new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.zonaHoraria, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function hoy() { return fechaDebug || hoyReal(); }
const D = s => new Date(s + 'T12:00:00Z');
const toISO = x => x.toISOString().slice(0, 10);
function addDays(s, n) { const x = D(s); x.setUTCDate(x.getUTCDate() + n); return toISO(x); }
function diff(a, b) { return Math.round((D(b) - D(a)) / 86400000); }
function dow(s) { return (D(s).getUTCDay() + 6) % 7; }
function lunesDe(s) { return addDays(s, -dow(s)); }
function fCorta(s) { const x = D(s); return `${DIAS_C[dow(s)]} ${x.getUTCDate()} ${MESES[x.getUTCMonth()]}`; }
function fDia(s) { const x = D(s); return `${x.getUTCDate()} ${MESES[x.getUTCMonth()]}`; }
function fLarga(s) { const x = D(s); return `${DIAS[dow(s)].toLowerCase()} ${x.getUTCDate()} de ${MESES_L[x.getUTCMonth()]}`; }

/* =====================================================================
   MOTOR DEL PLAN
   ===================================================================== */
const clone = o => JSON.parse(JSON.stringify(o));
const faseDe = s => CONFIG.fases.find(f => s >= f.inicio && s <= f.fin) || null;
const periodoDe = s => CONFIG.periodos.find(p => s >= p.inicio && s <= p.fin) || null;

function semanaTipo(id) {
  const ed = storage.get('semanas', {});
  if (ed[id]) return ed[id];
  const base = CONFIG.semanas[id];
  return base.dias || CONFIG.semanas.ultimo.dias;
}
function semanaEditada(id) { return !!storage.get('semanas', {})[id]; }
function puedeIntercambiar(lunes) {
  const p = periodoDe(lunes); if (!p) return false;
  const dias = semanaTipo(p.semana);
  const t = [dias[3].tipo, dias[4].tipo];
  return t.includes('hyrox') && t.includes('upper');
}
function sesionDe(s) {
  if (s < CONFIG.inicio) return { tipo: 'antes' };
  if (s > CONFIG.carrera.fecha) return { tipo: 'fin' };
  const p = periodoDe(s);
  let i = dow(s);
  if (storage.get('swaps', {})[lunesDe(s)] && (i === 3 || i === 4) && puedeIntercambiar(lunesDe(s))) i = i === 3 ? 4 : 3;
  let ses = { ...semanaTipo(p.semana)[i] };
  if (CONFIG.diasEspeciales[s]) ses = { ...ses, ...CONFIG.diasEspeciales[s] };
  ses.periodo = p; ses.fase = faseDe(s);
  return ses;
}
const esSesion = ses => ses && !['descanso', 'fin', 'antes'].includes(ses.tipo);
function metaSemana(lunes) {
  let n = 0;
  for (let i = 0; i < 7; i++) if (esSesion(sesionDe(addDays(lunes, i)))) n++;
  return n;
}
const totalSemanas = () => diff(CONFIG.inicio, lunesDe(CONFIG.carrera.fecha)) / 7 + 1;

/* ---------- Registro diario ---------- */
function diaVacio() { return { clase: null, comidas: [false, false, false, false], proteina: false, agua: false, sueno: false, creatina: false }; }
function diaLog(s) { const d = storage.get('dias', {})[s]; return d ? { ...diaVacio(), ...d } : diaVacio(); }
function setDia(s, patch) { const dias = storage.get('dias', {}); dias[s] = { ...diaLog(s), ...patch }; storage.set('dias', dias); }
const habitosOk = l => !!(l.proteina && l.comidas.every(Boolean));
const algunHabito = l => l.comidas.some(Boolean) || l.proteina || l.agua || l.sueno;

/* ---------- Calificación del día (0–10) ---------- */
function puntosDia(f, l) {
  const P = CONFIG.puntos, toca = esSesion(sesionDe(f));
  const partes = {
    clase:    { v: toca ? (l.clase === 'hecha' ? P.clase : 0) : P.clase, max: P.clase, t: toca ? 'Clase' : 'Descanso' },
    comidas:  { v: l.comidas.filter(Boolean).length * P.comida, max: P.comida * 4, t: 'Comidas' },
    proteina: { v: l.proteina ? P.proteina : 0, max: P.proteina, t: 'Proteína' },
    agua:     { v: l.agua ? P.agua : 0, max: P.agua, t: 'Agua' },
    sueno:    { v: l.sueno ? P.sueno : 0, max: P.sueno, t: 'Sueño' },
  };
  const total = Object.values(partes).reduce((a, p) => a + p.v, 0);
  return { total: Math.round(total * 10) / 10, partes };
}
// null = sin registro (no sabemos). Un día de clase ya pasado sin nada registrado cuenta como 0.
function calificacion(f) {
  const raw = storage.get('dias', {})[f];
  if (!raw) return (f < hoy() && f >= CONFIG.inicio && esSesion(sesionDe(f))) ? puntosDia(f, diaVacio()) : null;
  return puntosDia(f, { ...diaVacio(), ...raw });
}
const nivelCal = t => t >= 10 ? 4 : t >= 8 ? 3 : t >= 5 ? 2 : t >= 2.5 ? 1 : 0;
const fCal = t => Number.isInteger(t) ? String(t) : t.toFixed(1);

/* ---------- Rachas ---------- */
function rachaSemanal() {
  const H = hoy(), dias = storage.get('dias', {});
  const semanas = [];
  for (let l = lunesDe(CONFIG.inicio); l <= H && l <= CONFIG.carrera.fecha; l = addDays(l, 7)) {
    let hechas = 0;
    for (let i = 0; i < 7; i++) { const x = addDays(l, i); if (dias[x] && dias[x].clase === 'hecha') hechas++; }
    const meta = metaSemana(l);
    semanas.push({ lunes: l, meta, hechas, ok: hechas >= meta, actual: l === lunesDe(H) });
  }
  let actual = 0;
  for (let i = semanas.length - 1; i >= 0; i--) { const w = semanas[i]; if (w.actual && !w.ok) continue; if (w.ok) actual++; else break; }
  let mejor = 0, run = 0;
  semanas.forEach(w => { if (w.ok) { run++; mejor = Math.max(mejor, run); } else if (!w.actual) run = 0; });
  return { actual, mejor, semanas };
}
function rachaDiaria() {
  const H = hoy(), dias = storage.get('dias', {});
  const keys = Object.keys(dias).sort();
  let desde = CONFIG.inicio; if (keys.length && keys[0] < desde) desde = keys[0];
  let mejor = 0, run = 0;
  for (let x = desde; x <= H; x = addDays(x, 1)) {
    if (dias[x] && habitosOk({ ...diaVacio(), ...dias[x] })) { run++; mejor = Math.max(mejor, run); }
    else if (x !== H) run = 0;
  }
  let actual = 0;
  for (let x = H; x >= desde; x = addDays(x, -1)) {
    const ok = dias[x] && habitosOk({ ...diaVacio(), ...dias[x] });
    if (ok) actual++; else if (x === H) continue; else break;
  }
  return { actual, mejor };
}

/* ---------- InBody / checkpoints ---------- */
const inbodyAll = () => storage.get('inbody', {});
function lineaBase() {
  const ib = inbodyAll();
  const cp0 = CONFIG.checkpoints[0].fecha;
  if (ib[cp0]) return { cp: cp0, ...ib[cp0] };
  const k = Object.keys(ib).sort()[0];
  return k ? { cp: k, ...ib[k] } : null;
}
const topeGrasa = () => { const b = lineaBase(); return b ? +(b.grasa + CONFIG.topeGrasaExtra).toFixed(1) : null; };
function estadoPeso(cp, peso) {
  const [lo, hi] = cp.rango || [cp.peso - CONFIG.toleranciaPeso, cp.peso + CONFIG.toleranciaPeso];
  if (peso < lo - 1e-9) return { cls: 'b-warn', txt: 'Por debajo' };
  if (peso > hi + 1e-9) return { cls: 'b-warn', txt: 'Por arriba' };
  return { cls: 'b-ok', txt: 'En camino' };
}
function recomendaciones(cpFecha) {
  const ib = inbodyAll(), actual = ib[cpFecha]; if (!actual) return [];
  const base = lineaBase(), R = CONFIG.reglas, cp = CONFIG.checkpoints.find(c => c.fecha === cpFecha);
  if (base && base.cp === cpFecha) return [{ ...R.base, texto: `Tu tope de grasa en cada checkpoint: ${topeGrasa()}%. ${R.base.texto}` }];
  const out = [];
  const grasaAlta = base && actual.grasa > base.grasa + CONFIG.topeGrasaExtra + 1e-9;
  if (cp && cp.mantener) {
    if (actual.peso > cp.rango[1] + 1e-9) out.push(R.mantenAlto);
    else if (actual.peso < cp.rango[0] - 1e-9) out.push(R.mantenBajo);
  } else {
    const prevK = Object.keys(ib).filter(k => k < cpFecha).sort().pop();
    if (prevK) {
      const prev = ib[prevK];
      const dias = Math.max(diff(prev.fecha || prevK, actual.fecha || cpFecha), 1);
      const delta = actual.peso - prev.peso;
      if (delta * 14 / dias > 1.0 + 1e-9) out.push({ ...R.rapido, texto: `+${delta.toFixed(1)} kg desde el último InBody. ${R.rapido.texto}` });
      else if (delta < 0.2) out.push({ ...R.extra, texto: `${delta >= 0 ? '+' : ''}${delta.toFixed(1)} kg desde el último InBody. ${R.extra.texto}` });
    }
  }
  if (grasaAlta) out.push({ ...R.cena, texto: `${actual.grasa}% vs tope de ${topeGrasa()}%. ${R.cena.texto}` });
  if (!out.length) out.push(cp && cp.mantener ? R.mantenOk : R.perfecto);
  return out;
}

/* ---------- Tests ---------- */
function parseTiempo(t) {
  t = String(t || '').trim(); if (!t) return null;
  const p = t.split(':').map(Number);
  if (p.some(n => isNaN(n) || n < 0)) return null;
  if (p.length === 1) return Math.round(p[0] * 60);
  if (p.length === 2) return p[0] * 60 + p[1];
  if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  return null;
}
function fTiempo(seg) {
  seg = Math.round(Math.abs(seg));
  const h = Math.floor(seg / 3600), m = Math.floor(seg % 3600 / 60), s = seg % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
const testsAll = () => storage.get('tests', []).slice().sort((a, b) => a.fecha.localeCompare(b.fecha));
const testsDe = tipo => testsAll().filter(t => t.tipo === tipo);

/* ---------- Avisos del día ---------- */
function avisosDe(f, esHoy) {
  const out = [];
  const cp = CONFIG.checkpoints.find(c => c.fecha === f);
  const idx = CONFIG.checkpoints.indexOf(cp);
  if (cp) {
    const hecho = !!inbodyAll()[cp.fecha];
    out.push({ tono: 'acc', ic: 'IB', titulo: `Checkpoint ${idx + 1}: toca InBody`, texto: `${CONFIG.protocoloInBody} Meta: ${cp.peso} kg.`,
      btn: hecho ? null : { label: 'Capturar InBody', action: 'inbody', data: cp.fecha } });
  }
  const cpMañana = CONFIG.checkpoints.find(c => c.fecha === addDays(f, 1));
  if (cpMañana) out.push({ tono: 'info', ic: 'IB', titulo: 'Mañana es checkpoint', texto: 'InBody temprano, en ayunas y antes de entrenar. Cena normal hoy.' });
  CONFIG.tests.filter(t => t.fecha === f).forEach(t => out.push({ tono: 'acc', ic: 'T', titulo: t.titulo, texto: t.texto,
    btn: t.tipo ? { label: 'Registrar tiempo', action: 'test', data: t.tipo } : null }));
  if (f === CONFIG.carrera.fecha) out.push({ tono: 'acc', ic: '!', titulo: '¡Hoy es la carrera!', texto: `${CONFIG.carrera.lugar}. ${CONFIG.carrera.meta}.`, btn: { label: 'Registrar tiempo oficial', action: 'test', data: 'carrera' } });
  const fase = faseDe(f);
  if (fase && fase.inicio === f && fase.n > 1) out.push({ tono: 'info', ic: String(fase.n), titulo: `Arranca la fase ${fase.n}: ${fase.nombre}`, texto: fase.objetivo });
  const per = periodoDe(f);
  if (per && per.inicio === f && per.id !== 'p1') out.push({ tono: 'info', ic: '◷', titulo: `Nuevo periodo: ${per.nombre}`, texto: 'Cambia tu semana tipo. Revisa las horas antes de reservar.' });
  if (esHoy) {
    if (per && per.semana === 'enero' && !semanaEditada('enero'))
      out.push({ tono: 'warn', ic: '!', titulo: 'Tu semana de enero está pendiente', texto: 'Uso la del último periodo mientras tanto. Ajústala a tu horario nuevo.', btn: { label: 'Editar semana', action: 'editar-semana', data: 'enero' } });
    if (f > '2026-09-30' && !testsDe('1km').length) out.push({ tono: 'warn', ic: '!', titulo: 'Falta tu tiempo de 1 km', texto: 'Con él se ajustan tus ritmos.', btn: { label: 'Registrar', action: 'test', data: '1km' } });
    if (f > '2026-10-03' && !testsDe('5km').length) out.push({ tono: 'warn', ic: '!', titulo: 'Falta tu tiempo de 5 km', texto: 'Con él se ajustan tus ritmos.', btn: { label: 'Registrar', action: 'test', data: '5km' } });
    if (f > CONFIG.checkpoints[0].fecha && !lineaBase()) out.push({ tono: 'warn', ic: '!', titulo: 'Falta tu primer InBody', texto: 'Es tu línea base: sin él no hay topes de grasa.', btn: { label: 'Capturar', action: 'inbody', data: CONFIG.checkpoints[0].fecha } });
  }
  return out;
}

/* ---------- HOY ---------- */

  let acts;
  if (futuro) acts = `<div class="acts" style="grid-template-columns:1fr"><button class="btn ghost" disabled>Aún no llega este día</button></div>`;
  else if (log.clase === 'hecha') acts = `<div class="done-banner">${I.check}<span>${ses.tipo === 'carrera' ? '¡Carrera terminada!' : '¡Hecha! Una menos.'}</span><button data-action="clase" data-v="hecha">Deshacer</button></div>`;
  else if (log.clase === 'nofui') acts = `<div class="done-banner miss"><span>No fuiste. Pasa, mañana le sigues.</span><button data-action="clase" data-v="nofui">Deshacer</button></div>`;
  else acts = `<div class="acts"><button class="btn primary" data-action="clase" data-v="hecha">${I.check} ${ses.tipo === 'carrera' ? 'Terminé la carrera' : 'La hice'}</button><button class="btn" data-action="clase" data-v="nofui">No fui</button></div>`;

  return `<div class="card ses">${kick}<h3>${esc(ses.clase)}</h3>${body}${acts}</div>`;
}

function tarjetaHabitos(f, H) {
  const log = diaLog(f), futuro = f > H, rd = rachaDiaria(), cal = puntosDia(f, log);
  const dis = futuro ? 'disabled' : '';

      <span class="chk">${I.check}</span><span class="grow"><span class="t">${esc(h.t)}</span><br><span class="s">${esc(h.s)}</span></span></button>`).join('');
  return `<div class="card">
    <div class="row between" style="margin-bottom:10px">
      <div class="grow"><h2 style="margin:0">Tu día ${f === H ? 'de hoy' : ''}</h2><div class="muted xs">${rd.actual ? `Racha: ${rd.actual} ${rd.actual === 1 ? 'día' : 'días'} con proteína + 4 comidas` : 'Proteína + 4 comidas = día de racha'}</div>
        <div class="pts">${Object.values(cal.partes).map(p => `<span class="${p.v >= p.max ? 'full' : ''}">${p.t} ${fCal(p.v)}/${fCal(p.max)}</span>`).join('')}</div></div>
      <div class="ring" style="--p:${cal.total * 10};--ring:var(--s${nivelCal(cal.total)})" aria-label="Calificación ${fCal(cal.total)} de 10"><span class="num">${fCal(cal.total)}<small>/10</small></span></div>

}

/* ---------- RACHAS ---------- */
function vistaRachas() {
  const rs = rachaSemanal(), rd = rachaDiaria();
  const animo = (r, u) => r.actual === 0 && r.mejor > 0 ? `Tu mejor fue ${r.mejor} ${u}. Hoy empiezas otra.` : r.actual > 0 && r.actual >= r.mejor ? '¡Es tu mejor racha!' : `Mejor: ${r.mejor} ${u}`;
  let html = `<div class="stats">
    <div class="stat"><div class="l">Entrenamiento</div><div class="v num">${rs.actual}</div><div class="u">${rs.actual === 1 ? 'semana completa' : 'semanas completas'}</div><div class="best">${animo(rs, rs.mejor === 1 ? 'semana' : 'semanas')}</div></div>
    <div class="stat"><div class="l">Hábitos</div><div class="v num">${rd.actual}</div><div class="u">${rd.actual === 1 ? 'día' : 'días'} seguidos</div><div class="best">${animo(rd, rd.mejor === 1 ? 'día' : 'días')}</div></div>
  </div>`;

  const segBtn = (v, t) => `<button class="${state.heat === v ? 'on' : ''}" data-action="heat" data-v="${v}">${t}</button>`;
  html += `<div class="card"><div class="seg">${segBtn('dia', 'Calificación')}${segBtn('clases', 'Clases')}${segBtn('habitos', 'Hábitos')}</div>${heatmap()}${state.heat === 'dia' ? promediosCal() : ''}</div>`;

  const ult = rs.semanas.slice(-6).reverse();
  html += `<div class="card"><h2>Semanas <small>meta del plan</small></h2>${ult.length ? ult.map(w => `<div class="wk"><span class="${w.actual ? '' : 'muted'}">${w.actual ? 'Esta semana' : 'Sem. ' + fDia(w.lunes)}</span>
    <div class="pbar"><i style="width:${Math.min(100, w.hechas / w.meta * 100)}%"></i></div><b class="num" style="text-align:right">${w.hechas}/${w.meta}</b></div>`).join('')
    : '<div class="empty">Tu primera semana arranca el lunes 28 sep.</div>'}
    <p class="muted xs" style="margin:10px 0 0">Una semana cuenta cuando cumples todas sus clases (5 normalmente, 4 en vacaciones). Si una se rompe, no pasa nada: la mejor racha se queda guardada.</p></div>`;
  return html;
}

function heatmap() {
  const H = hoy(), dias = storage.get('dias', {});
  const l0 = lunesDe(CONFIG.inicio), nW = totalSemanas();
  let cells = '<span></span>';
  let prevMes = -1;
  for (let w = 0; w < nW; w++) {
    const m = D(addDays(l0, w * 7 + 3)).getUTCMonth();
    cells += `<span class="hl">${m !== prevMes ? MESES[m] : ''}</span>`; prevMes = m;
  }
  for (let r = 0; r < 7; r++) {
    cells += `<span class="hl">${r % 2 === 0 ? DIAS_1[r] : ''}</span>`;
    for (let w = 0; w < nW; w++) {
      const x = addDays(l0, w * 7 + r), ses = sesionDe(x), lg = dias[x] ? { ...diaVacio(), ...dias[x] } : null;
      let cls = '';
      if (x > CONFIG.carrera.fecha) cls = 'rest fut';
      else if (ses.tipo === 'carrera') cls = 'race';
      else if (state.heat === 'dia') {
        const c = x <= H ? calificacion(x) : null;
        cls = c ? 's' + nivelCal(c.total) : 'rest';
      }
      else if (state.heat === 'clases') {
        if (lg && lg.clase === 'hecha') cls = 'l2';
        else if (!esSesion(ses)) cls = 'rest';
        else if (lg && lg.clase === 'nofui') cls = 'miss';
      } else {
        if (lg && habitosOk(lg)) cls = 'l2';
        else if (lg && algunHabito(lg)) cls = 'l1';
      }
      if (x > H && ses.tipo !== 'carrera') cls += ' fut';
      if (x === H) cls += ' today';
      const tip = state.heat === 'dia' && x <= H && calificacion(x) ? ` · ${fCal(calificacion(x).total)}/10` : '';
      cells += `<i class="hc ${cls}" title="${fCorta(x)}${tip}" ${x <= CONFIG.carrera.fecha ? `data-action="ir-dia" data-v="${x}"` : ''}></i>`;
    }
  }
  const leg = state.heat === 'dia'
    ? '<span><i style="background:var(--s4)"></i>10</span><span><i style="background:var(--s3)"></i>8–9.5</span><span><i style="background:var(--s2)"></i>5–7.5</span><span><i style="background:var(--s1)"></i>2.5–4.5</span><span><i style="background:var(--s0)"></i>0–2</span><span><i style="box-shadow:inset 0 0 0 1px var(--line)"></i>Sin registro</span>'
    : state.heat === 'clases'
    ? '<span><i style="background:var(--heat2)"></i>Hecha</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--faint)"></i>No fui</span><span><i style="background:var(--heat0)"></i>Pendiente</span><span><i style="box-shadow:inset 0 0 0 1px var(--line)"></i>Descanso</span><span><i style="background:var(--text)"></i>Carrera</span>'
    : '<span><i style="background:var(--heat2)"></i>Proteína + 4 comidas</span><span><i style="background:var(--heat1)"></i>Parcial</span><span><i style="background:var(--heat0)"></i>Nada</span>';
  return `<div class="heat" style="grid-template-columns:12px repeat(${nW},minmax(0,1fr))">${cells}</div><div class="legend">${leg}</div>`;
}

function promediosCal() {
  const H = hoy(), prom = (desde) => {
    const v = []; for (let x = desde; x <= H; x = addDays(x, 1)) { const c = calificacion(x); if (c) v.push(c.total); }
    return v.length ? fCal(Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10) : '—';
  };
  let diez = 0; for (let x = CONFIG.inicio; x <= H; x = addDays(x, 1)) { const c = calificacion(x); if (c && c.total >= 10) diez++; }
  return `<div class="avg"><div><small>Últimos 7 días</small><strong class="num">${prom(addDays(H, -6))}</strong></div><div><small>Todo el plan</small><strong class="num">${prom(CONFIG.inicio)}</strong></div><div><small>Días 10/10</small><strong class="num">${diez}</strong></div></div>
    <p class="muted xs" style="margin:10px 0 0">Clase 4 · comidas 2 · proteína 2 · agua 1 · sueño 1. En descanso la clase cuenta sola. Toca un cuadrito para ver o corregir ese día.</p>`;
}

        <div><small>Grasa</small><strong class="num">${r.grasa}%</strong>${eg ? `<em class="${eg.cls}" style="background:none;padding:0">${eg.txt} ${tope}%</em>` : ''}</div>

/* ---------- PROGRESO ---------- */
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }
function lineChart(o) {
  const W = 340, Hh = 180, L = 34, R = 16, T = 14, B = 24;
  const x0 = o.xMin, x1 = o.xMax, span = diff(x0, x1);
  const vals = [];
  o.series.forEach(s => s.pts.forEach(p => vals.push(p.y)));
  (o.hlines || []).forEach(h => vals.push(h.y));
  (o.bands || []).forEach(b => vals.push(b.y0, b.y1));
  if (!o.series.some(s => s.cls === 'real' && s.pts.length)) return `<div class="empty">${esc(o.vacio)}</div>`;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.12, o.minPad || 0.5); lo -= pad; hi += pad;
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const X = s => (L + diff(x0, s) / span * (W - L - R)).toFixed(1);
  const Y = v => (T + (hi - v) / (hi - lo) * (Hh - T - B)).toFixed(1);
  let g = '';
  (o.bands || []).forEach(b => { g += `<rect class="band" x="${L}" width="${W - L - R}" y="${Y(b.y1)}" height="${Y(b.y0) - Y(b.y1)}" rx="3"/>`; });
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis num" x="${L - 6}" y="${+Y(v) + 3.5}" text-anchor="end">${step < 1 ? v.toFixed(1) : Math.round(v)}</text>`;
  let [yy, mm] = x0.split('-').map(Number);
  for (let k = 0; k < 8; k++) {
    const s = `${yy}-${String(mm).padStart(2, '0')}-01`;
    if (s > x1) break;
    if (s >= x0) g += `<text class="axis" x="${X(s)}" y="${Hh - 6}" text-anchor="middle">${MESES[mm - 1]}</text>`;
    mm++; if (mm > 12) { mm = 1; yy++; }
  }
  (o.hlines || []).forEach(h => { g += `<line class="tope" x1="${L}" x2="${W - R}" y1="${Y(h.y)}" y2="${Y(h.y)}"/><text class="tl" fill="var(--bad)" x="${W - R}" y="${+Y(h.y) - 5}" text-anchor="end">${esc(h.label)}</text>`; });
  const H = hoy();
  if (H >= x0 && H <= x1) g += `<line class="todayl" x1="${X(H)}" x2="${X(H)}" y1="${T}" y2="${Hh - B}"/>`;
  o.series.forEach(s => {
    if (!s.pts.length) return;
    const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x)} ${Y(p.y)}`).join(' ');
    g += `<path class="${s.cls}" d="${d}"/>`;
    if (s.cls === 'real') {
      s.pts.forEach(p => { g += `<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5"/>`; });
      const last = s.pts[s.pts.length - 1];
      g += `<text class="vl num" x="${X(last.x)}" y="${+Y(last.y) - 10}" text-anchor="${diff(x0, last.x) / span > .8 ? 'end' : 'middle'}">${last.y}</text>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(o.titulo)}">${g}</svg>`;
}
const legendHTML = items => `<div class="legend">${items.map(([c, t, dash]) => `<span><i style="${dash ? `background:none;border-top:2px dashed ${c};height:0;width:14px;border-radius:0` : `background:${c}`}"></i>${t}</span>`).join('')}</div>`;

function vistaProgreso() {
  const ib = inbodyAll(), keys = Object.keys(ib).sort(), base = lineaBase(), tope = topeGrasa();
  const xMin = CONFIG.atleta.fechaPesoInicial, xMax = CONFIG.carrera.fecha;
  const real = k => keys.filter(c => ib[c][k] != null && ib[c][k] !== '').map(c => ({ x: ib[c].fecha || c, y: +ib[c][k] }));

  const metaPeso = [{ x: xMin, y: CONFIG.atleta.pesoInicial }, ...CONFIG.checkpoints.map(c => ({ x: c.fecha, y: c.rango ? (c.rango[0] + c.rango[1]) / 2 : c.peso })), { x: xMax, y: 69.75 }];
  const pesoReal = [{ x: xMin, y: CONFIG.atleta.pesoInicial }, ...real('peso')];
  const ultimo = pesoReal[pesoReal.length - 1];
  const cpNext = CONFIG.checkpoints.find(c => c.fecha >= hoy());
  let html = `<div class="card"><h2>Peso <small>${ultimo.y} kg${cpNext ? ` · próximo ${cpNext.rango ? cpNext.rango.join('–') : cpNext.peso}` : ''}</small></h2>
    ${lineChart({ titulo: 'Peso real contra meta', xMin, xMax, minPad: 0.4, series: [{ cls: 'meta', pts: metaPeso }, { cls: 'real', pts: pesoReal }], vacio: '' })}
    ${legendHTML([['var(--real)', 'Real'], ['var(--faint)', 'Meta', true]])}</div>`;

  const grasa = real('grasa');
  html += `<div class="card"><h2>% de grasa <small>${tope != null ? `tope ${tope}%` : 'sin línea base'}</small></h2>
    ${lineChart({ titulo: 'Grasa contra tope', xMin, xMax, minPad: 0.6, series: [{ cls: 'real', pts: grasa }], hlines: tope != null ? [{ y: tope, label: `Tope ${tope}%` }] : [], bands: [{ y0: CONFIG.grasaIdealCarrera[0], y1: CONFIG.grasaIdealCarrera[1] }], vacio: 'Aparece con tu primer InBody (5 oct).' })}
    ${legendHTML([['var(--real)', 'Real'], ['var(--bad)', 'Tope (base +1%)', true], ['var(--ok-bg)', `Ideal carrera ${CONFIG.grasaIdealCarrera.join('–')}%`]])}</div>`;

  const musc = real('musculo');
  let metaM = [];
  if (base && base.musculo != null && base.musculo !== '') {
    const b0 = +base.musculo, p0 = CONFIG.checkpoints[0].peso, span = CONFIG.atleta.pesoMeta - p0;
    let fr = 0;
    metaM = CONFIG.checkpoints.map(c => { fr = Math.max(fr, Math.min(1, (c.peso - p0) / span)); return { x: c.fecha, y: +(b0 + CONFIG.musculoMeta * fr).toFixed(1) }; });
  }
  html += `<div class="card"><h2>Masa muscular <small>${base && base.musculo ? `meta ≈ +${CONFIG.musculoMeta} kg` : ''}</small></h2>
    ${lineChart({ titulo: 'Masa muscular esquelética', xMin, xMax, minPad: 0.4, series: [{ cls: 'meta', pts: metaM }, { cls: 'real', pts: musc }], vacio: 'Aparece con tu primer InBody (5 oct).' })}
    ${legendHTML([['var(--real)', 'Real'], ['var(--faint)', 'Meta aprox.', true]])}</div>`;

  html += `<div class="card"><h2>Tests <button class="btn sm primary" data-action="test" data-v="">+ Registrar</button></h2>`;
  const all = testsAll();
  if (!all.length) html += `<div class="empty">Primero: 1 km el mié 30 sep y 5 km el sáb 3 oct.</div>`;
  Object.entries(CONFIG.tiposTest).forEach(([k, tt]) => {
    const lst = all.filter(t => t.tipo === k); if (!lst.length) return;
    const first = lst[0], last = lst[lst.length - 1], best = lst.reduce((a, b) => b.seg < a.seg ? b : a);
    const delta = last.seg - first.seg;
    let meta = '';
    if (tt.mejora) { const obj = first.seg - tt.mejora; meta = `Meta: ${fTiempo(obj)} ${best.seg <= obj ? '✓' : ''}`; }
    else if (tt.objetivo) meta = `Meta: ${fTiempo(tt.objetivo)} ${best.seg < tt.objetivo ? '✓' : ''}`;
    else meta = tt.metaTxt;
    html += `<div style="margin-top:14px"><div class="row between"><b>${esc(tt.nombre)}</b><span class="muted xs">${esc(meta)}</span></div>
      <div class="kv" style="margin-top:8px"><div><small>Primero</small><strong class="num">${fTiempo(first.seg)}</strong></div>

// Agrupa los pedazos de texto del PDF en renglones (misma altura), de izquierda a derecha.
function lineasDePagina(tc) {
  const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5], h: Math.abs(i.transform[3]) || 8 }));
  items.sort((a, b) => b.y - a.y || a.x - b.x);
  const lineas = [];
  items.forEach(it => {

    if (l && Math.abs(l.y - it.y) <= Math.max(2, it.h * 0.45)) l.items.push(it); else lineas.push({ y: it.y, items: [it] });

async function renderPagina(page, ancho) {

  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp, intent: 'print' }).promise;  // 'print' no espera a la pantalla (sigue si la app pasa a segundo plano)

}

const normTxt = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()

    .replace(/\d+(?:\.\d+)?\s+[-–]\s+\d+(?:\.\d+)?/g, ' ');               // 55.8 - 75.4
  const toks = [...seg.matchAll(/\d+(?:\.\d+)?/g)].map(m => ({ s: m[0], v: parseFloat(m[0]) }));
  // Quita las escalas de las barras (55 70 85 100 …): 3+ números seguidos con el mismo salto.
  const fuera = new Set();

    const d = toks[i + 1].v - toks[i].v; if (Math.abs(d) < 1e-9) continue;

      if (w >= 0) tras = tras.slice(0, w);                                 // corta donde empieza otro dato
      const v = elegirNumero(numerosDe(tras), c);

async function leerInBody(file, estado) {

    ${pre ? `<details><summary class="small">Ver el texto que leí</summary><pre class="ocr">${esc(pre.texto.slice(0, 4000) || '(vacío)')}</pre></details>` : ''}
    <p class="muted xs">${esc(CONFIG.protocoloInBody)}</p>
    <button class="btn primary block" style="margin-top:8px" data-action="guardar-inbody" data-v="${fecha}">Guardar</button>
    ${!pre && r.peso != null ? `<button class="btn ghost block" style="margin-top:8px" data-action="borrar-inbody" data-v="${fecha}">Borrar este InBody</button>` : ''}
    <button class="btn ghost block" style="margin-top:8px" data-action="cerrar">Cancelar</button>`);
}
function modalTest(tipo) {
  openModal(`<h2>Registrar test</h2>
    <label class="field"><span>Tipo</span><select class="input" id="t-tipo">${Object.entries(CONFIG.tiposTest).map(([k, t]) => `<option value="${k}" ${k === tipo ? 'selected' : ''}>${t.nombre}</option>`).join('')}</select></label>
    <div class="grid2"><label class="field"><span>Fecha</span><input class="input" type="date" id="t-fecha" value="${state.fecha || hoy()}"></label>
    <label class="field"><span>Tiempo (m:ss o h:mm:ss)</span><input class="input num" id="t-tiempo" inputmode="text" placeholder="4:05" autocomplete="off"></label></div>
    <label class="field"><span>Nota (opcional)</span><input class="input" id="t-nota" placeholder="Ej. caminadora 1% inclinación"></label>
    <button class="btn primary block" style="margin-top:14px" data-action="guardar-test">Guardar</button>
    <button class="btn ghost block" style="margin-top:8px" data-action="cerrar">Cancelar</button>`);
}
function modalSemana(id) {
  const dias = semanaTipo(id);
  const opts = t => Object.entries(CONFIG.tipos).filter(([k]) => k !== 'carrera').map(([k, v]) => `<option value="${k}" ${k === t ? 'selected' : ''}>${v.nombre}</option>`).join('');
  openModal(`<h2>Editar: ${esc(CONFIG.semanas[id].nombre)}</h2><p class="muted small" style="margin:0">Los cambios aplican a todos los días de este periodo.</p>
    ${dias.map((d, i) => `<div class="edday"><b>${DIAS[i]}</b>
      <div class="grid2"><label class="field"><span>Tipo</span><select class="input" id="e-tipo-${i}">${opts(d.tipo)}</select></label>
      <label class="field"><span>Hora</span><input class="input" id="e-hora-${i}" value="${esc(d.hora)}"></label></div>
      <label class="field"><span>Clase</span><input class="input" id="e-clase-${i}" value="${esc(d.clase)}"></label>
      <div class="grid2"><label class="field"><span>Zona</span><input class="input" id="e-zona-${i}" value="${esc(d.zona)}"></label>
      <label class="field"><span>Nota</span><input class="input" id="e-nota-${i}" value="${esc(d.nota)}"></label></div></div>`).join('')}
    <button class="btn primary block" style="margin-top:14px" data-action="guardar-semana" data-v="${id}">Guardar semana</button>
    <button class="btn ghost block" style="margin-top:8px" data-action="cerrar">Cancelar</button>`);
}
function modalAjustes() {
  const dias = Object.keys(storage.get('dias', {})).length, ib = Object.keys(inbodyAll()).length, ts = testsAll().length;
  openModal(`<h2>Ajustes y respaldo</h2><p class="muted small" style="margin:0">${dias} días registrados · ${ib} InBody · ${ts} tests${storage.ready() ? '' : ' · ⚠️ este navegador no está guardando datos'}</p>
    <div class="card" style="margin-top:14px"><h2>Respaldo</h2><p class="muted small" style="margin:0 0 12px">Exporta tus datos de vez en cuando y guárdalos en Archivos o iCloud.</p>
      <button class="btn primary block" data-action="exportar">Exportar JSON</button>
      ${navigator.share ? '<button class="btn block" style="margin-top:8px" data-action="compartir">Compartir respaldo…</button>' : ''}
      <label class="btn block" style="margin-top:8px">Importar archivo JSON<input type="file" id="imp-file" accept="application/json,.json" hidden></label>
      <details style="margin-top:10px;border:0;padding:0"><summary class="small">Pegar JSON a mano</summary><textarea class="input" id="imp-text" placeholder='{"app":"hyrox-santiago",...}'></textarea><button class="btn sm block" style="margin-top:8px" data-action="importar-texto">Importar texto</button></details>
    </div>
    <div class="card" style="margin-top:12px"><h2>Zona peligrosa</h2><p class="muted small" style="margin:0 0 12px">Borra todo: días, InBody, tests y semanas editadas.</p>
      <button class="btn ghost block" style="color:var(--bad)" data-action="reset-1">Reiniciar datos</button></div>
    <p class="muted xs" style="text-align:center;margin-top:14px">HYROX Santiago · v1 · Funciona sin internet${fechaDebug ? ` · fecha simulada ${fechaDebug}` : ''}</p>
    <button class="btn ghost block" data-action="cerrar">Cerrar</button>`);
  $('#imp-file').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => importar(rd.result);
    rd.readAsText(file);
  });
}
function importar(texto) {
  try {
    const obj = JSON.parse(texto);
    storage.importAll(obj);
    closeModal(); render(); toast('Datos importados');
  } catch (e) { toast(e.message.includes('respaldo') ? e.message : 'No pude leer ese JSON'); }
}
function archivoRespaldo() {
  const blob = new Blob([JSON.stringify(storage.exportAll(), null, 2)], { type: 'application/json' });
  return { blob, name: `hyrox-santiago-${hoy()}.json` };
}

/* ---------- ACCIONES ---------- */
const ACTIONS = {
  tab(d) { state.tab = d.v; if (d.v !== 'hoy') state.fecha = null; render(); window.scrollTo(0, 0); },
  'ver-dia'(d) { state.fecha = d.v === hoy() ? null : d.v; render(); },
  'ir-dia'(d) { state.fecha = d.v === hoy() ? null : d.v; state.tab = 'hoy'; render(); window.scrollTo(0, 0); },
  'ver-hoy'() { state.fecha = null; render(); },
  semana(d) { state.fecha = addDays(state.fecha || hoy(), +d.v); if (state.fecha === hoy()) state.fecha = null; render(); },
  clase(d) {
    const f = state.fecha || hoy(); const cur = diaLog(f).clase;
    const v = cur === d.v ? null : d.v;
    setDia(f, { clase: v });
    render();
    if (v === 'hecha') {
      const l = lunesDe(f), meta = metaSemana(l), dias = storage.get('dias', {});
      let n = 0; for (let i = 0; i < 7; i++) if ((dias[addDays(l, i)] || {}).clase === 'hecha') n++;
      toast(n === meta ? `¡Semana completa! ${n}/${meta}` : `Registrada · ${n}/${meta} esta semana`);
    }
  },
  comida(d) { const f = state.fecha || hoy(), c = diaLog(f).comidas.slice(); c[+d.v] = !c[+d.v]; setDia(f, { comidas: c }); render(); if (habitosOk(diaLog(f)) && c[+d.v]) toast('Día de racha cumplido'); },
  habito(d) { const f = state.fecha || hoy(), l = diaLog(f); setDia(f, { [d.v]: !l[d.v] }); render(); if (d.v === 'proteina' && !l.proteina && habitosOk(diaLog(f))) toast('Día de racha cumplido'); },
  swap() { const l = lunesDe(state.fecha || hoy()), s = storage.get('swaps', {}); if (s[l]) delete s[l]; else s[l] = true; storage.set('swaps', s); render(); toast(s[l] ? 'Jueves y viernes intercambiados' : 'Semana normal'); },
  heat(d) { state.heat = d.v; render(); },
  meta(d, el) { const m = storage.get('metas', {}), v = el.dataset.m === 'si'; if (m[d.v] === v) delete m[d.v]; else m[d.v] = v; storage.set('metas', m); render(); },
  inbody(d) { modalInBody(d.v); },
  'guardar-inbody'(d) {
    const peso = num($('#ib-peso').value), grasa = num($('#ib-grasa').value);
    if (peso == null || peso < 30 || peso > 150) return toast('Revisa el peso');
    if (grasa == null || grasa < 2 || grasa > 50) return toast('Revisa el % de grasa');
    const ib = inbodyAll(), key = $('#ib-cp').value || d.v, previo = ib[d.v] || {};
    const reg = { fecha: $('#ib-fecha').value || key };
    CAMPOS_INBODY.forEach(c => { const v = num($('#ib-' + c.k).value); if (v != null) reg[c.k] = v; });
    const archivo = archivoPendiente || previo.archivo;
    if (archivo) reg.archivo = archivo;
    if (key !== d.v && !archivoPendiente) delete ib[d.v];   // lo movieron de checkpoint
    ib[key] = reg;
    let aviso = null;
    if (!storage.set('inbody', ib)) { delete reg.archivo; storage.set('inbody', ib); aviso = 'Guardado, pero sin la imagen: ya no hay espacio'; }
    archivoPendiente = null;
    closeModal(); render();
    const r = recomendaciones(key)[0];
    toast(aviso || (r ? r.titulo : 'InBody guardado'));
  },
  'ver-hoja'(d) {
    const r = inbodyAll()[d.v]; if (!r || !r.archivo) return;
    openModal(`<h2>Hoja del InBody</h2><p class="muted small" style="margin:0">${fLarga(r.fecha || d.v)} · ${esc(r.archivo.nombre || '')}</p>
      <img class="hoja" src="${r.archivo.thumb}" alt="Hoja del InBody"><button class="btn ghost block" style="margin-top:12px" data-action="cerrar">Cerrar</button>`);
  },
  'borrar-inbody'(d) { if (!confirm('¿Borrar este InBody?')) return; const ib = inbodyAll(); delete ib[d.v]; storage.set('inbody', ib); closeModal(); render(); },
  test(d) { modalTest(d.v || '1km'); },
  'guardar-test'() {
    const seg = parseTiempo($('#t-tiempo').value);
    if (!seg) return toast('Escribe el tiempo, ej. 4:05');
    const ts = storage.get('tests', []);
    ts.push({ id: Date.now().toString(36), tipo: $('#t-tipo').value, fecha: $('#t-fecha').value || hoy(), seg, nota: $('#t-nota').value.trim() });
    storage.set('tests', ts); closeModal(); render(); toast(`Guardado: ${fTiempo(seg)}`);
  },
  'borrar-test'(d) { if (!confirm('¿Borrar este registro?')) return; storage.set('tests', storage.get('tests', []).filter(t => t.id !== d.v)); render(); },
  'plan-sel'(d) { state.plan = d.v; render(); },
  'editar-semana'(d) { modalSemana(d.v); },
  'guardar-semana'(d) {
    const dias = [0, 1, 2, 3, 4, 5, 6].map(i => ({ tipo: $(`#e-tipo-${i}`).value, hora: $(`#e-hora-${i}`).value.trim(), clase: $(`#e-clase-${i}`).value.trim() || CONFIG.tipos[$(`#e-tipo-${i}`).value].nombre, zona: $(`#e-zona-${i}`).value.trim(), nota: $(`#e-nota-${i}`).value.trim() }));
    const ed = storage.get('semanas', {}); ed[d.v] = dias; storage.set('semanas', ed);
    closeModal(); state.plan = d.v; render(); toast('Semana guardada');
  },
  'restaurar-semana'(d) { if (!confirm('¿Regresar a la semana original?')) return; const ed = storage.get('semanas', {}); delete ed[d.v]; storage.set('semanas', ed); render(); },
  'editar-horario'() {
    const p = CONFIG.periodos.find(x => x.horarioEditable);
    openModal(`<h2>Horario de enero</h2><label class="field"><span>Tus clases del Tec</span><textarea class="input" id="h-txt" style="font-family:inherit;font-size:16px">${esc(storage.get('horarioEnero', ''))}</textarea></label>
      <button class="btn primary block" style="margin-top:12px" data-action="guardar-horario">Guardar</button><button class="btn ghost block" style="margin-top:8px" data-action="cerrar">Cancelar</button>`);
    void p;
  },
  'guardar-horario'() { const t = $('#h-txt').value.trim(); if (t) storage.set('horarioEnero', t); else storage.remove('horarioEnero'); closeModal(); render(); },
  ajustes() { modalAjustes(); },
  cerrar() { closeModal(); },
  exportar() {
    const { blob, name } = archivoRespaldo();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Respaldo exportado');
  },
  async compartir() {
    const { blob, name } = archivoRespaldo();
    const file = new File([blob], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'Respaldo HYROX' });
      else await navigator.share({ title: 'Respaldo HYROX', text: JSON.stringify(storage.exportAll()) });
    } catch (e) { /* cancelado */ }
  },
  'importar-texto'() { importar($('#imp-text').value); },
  'reset-1'() {
    openModal(`<h2>¿Seguro?</h2><p class="muted">Se borra todo lo que has registrado. Si no tienes respaldo, no hay forma de recuperarlo.</p>
      <button class="btn primary block" data-action="exportar">Exportar respaldo primero</button>
      <button class="btn danger block" style="margin-top:8px" data-action="reset-2">Sí, borrar todo</button>
      <button class="btn ghost block" style="margin-top:8px" data-action="cerrar">Cancelar</button>`);
  },
  'reset-2'() { storage.clear(); state.fecha = null; closeModal(); render(); toast('Datos reiniciados'); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('change', e => {
  if (!e.target.matches('.ib-file')) return;
  const file = e.target.files && e.target.files[0]; if (!file) return;
  procesarArchivoInBody(file, e.target.dataset.cp || null);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
// Si la app queda abierta y cambia el día (o regresa del fondo), refresca.
let ultimoDia = hoy();
document.addEventListener('visibilitychange', () => { if (!document.hidden && hoy() !== ultimoDia) { ultimoDia = hoy(); state.fecha = null; render(); } });

(async function main() {
  await storage.init();
  if (fechaDebug) document.body.insertAdjacentHTML('beforeend', `<div class="debug">Fecha simulada: ${fechaDebug}</div>`);
  render();
})();
</script>
</body>
</html>
